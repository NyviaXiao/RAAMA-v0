[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mas"
version = "0.1.0"
description = "Point-in-time adaptive multi-agent CSI 300 quantitative research"
requires-python = ">=3.11"
dependencies = ["baostock>=0.9.4", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
