[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mas"
version = "0.1.0"
description = "Point-in-time adaptive multi-agent CSI 300 quantitative research"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.97",
    "baostock>=0.9.4",
    "gepa>=0.1.4",
    "numpy>=2.0",
    "pypdf>=5.0",
    "fonttools==4.67.0",
]

[project.scripts]
raama-harness = "adaptive_mas.harness_service:main"
raama-rag = "adaptive_mas.industrial_rag.cli:main"
raama-rag-temporal = "adaptive_mas.industrial_rag.temporal_workflow:main"
raama-optimizer-verify = "adaptive_mas.optimizer_reference:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
verification = ["scipy>=1.14,<2"]
postgres = ["psycopg[binary]==3.3.6"]
object-storage = ["boto3==1.43.118"]
document-ai = [
    "docling[rapidocr]==2.129.0",
    "rapidocr==3.9.2",
    "torch==2.14.1",
    "transformers==5.20.2",
]
temporal = ["temporalio==1.34.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_mas = ["industrial_rag/migrations/*.sql", "industrial_rag/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
