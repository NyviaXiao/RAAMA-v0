services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: raama_smoke
      POSTGRES_USER: raama_smoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  rustfs:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in the private env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in the private env file}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    ports:
      - "127.0.0.1::9000"
    volumes:
      - rustfs-data:/data
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1::9200"
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1::6333"
    volumes:
      - qdrant-data:/qdrant/storage
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    ports:
      - "127.0.0.1::7233"
      - "127.0.0.1::8233"
volumes:
  postgres-data:
  rustfs-data:
  qdrant-data:
